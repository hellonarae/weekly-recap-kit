      - { n: 5,  es: "España",          en: "Spain",             cat: "Countries", img: "flag:es" }
      - { n: 6,  es: "Inglaterra",      en: "England",           cat: "Countries", img: "flag:gb-eng" }
      - { n: 7,  es: "México",          en: "Mexico",            cat: "Countries", img: "flag:mx" }
      - { n: 8,  es: "estudiante",      en: "student",           cat: "Jobs" }
      - { n: 9,  es: "profesor",        en: "teacher (m.)",      cat: "Jobs" }
      - { n: 10, es: "profesora",       en: "teacher (f.)",      cat: "Jobs" }
      - { n: 11, es: "médico",          en: "doctor",            cat: "Jobs" }
