    entries:
      - { n: 1, es: "¿De dónde eres?", en: "Where are you from?", cat: "Phrases", kind: phrase }
      - { n: 2, es: "Soy de…",         en: "I'm from…",           cat: "Phrases", kind: phrase }
      - { n: 3, es: "ciudad",          en: "city",                cat: "Places" }
      - { n: 4, es: "país",            en: "country",             cat: "Places" }
