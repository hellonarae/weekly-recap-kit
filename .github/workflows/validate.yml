# Runs on every pull request: content validation + a build. The result is posted as a PR comment so the
# teacher sees ✅/❌ without opening the Actions tab. (Vercel adds its own preview-URL comment.)
name: validate
on:
  pull_request:
    paths: ['levels/**', 'course.yml', 'src/**', 'scripts/**', 'package*.json']
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate content
        id: validate
        run: |
          set +e
          npm run validate 2>&1 | tee validate.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.validate.outputs.code == '0'
        run: npm run build
      - name: Comment on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.validate.outputs.code }}' === '0' && '${{ job.status }}' !== 'failure';
            const body = (ok ? '✅ **Content check passed.** Review the files below, then merge.' : '❌ **Content check failed** — fix the lines listed, then push again.')
              + '\n\n```\n' + fs.readFileSync('validate.txt', 'utf8').slice(-6000) + '\n```';
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes('Content check'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Fail the job if validation failed
        if: steps.validate.outputs.code != '0'
        run: exit 1
